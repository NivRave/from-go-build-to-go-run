name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag whose release PDF should be (re)built, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Publish combined PDF
    runs-on: ubuntu-24.04
    env:
      # A tag push sets github.ref_name; a manual run passes the tag as input.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Merge all slides into one PDF
        run: go run github.com/pdfcpu/pdfcpu/cmd/pdfcpu@v0.16.4 merge "$RUNNER_TEMP/merged.pdf" slides/*.pdf

      # Most slide text is already real text; covers and code snippets are
      # images. --redo-ocr keeps the existing text and OCRs only the image
      # regions, which makes the code searchable too.
      - name: Add a searchable text layer to image regions (OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y ocrmypdf
          if ocrmypdf --redo-ocr --output-type pdf --optimize 0 --jobs 4 "$RUNNER_TEMP/merged.pdf" from-go-build-to-go-run.pdf; then
            echo "OCR complete"
          else
            echo "::warning::OCR failed; publishing the merged PDF without the extra text layer"
            cp "$RUNNER_TEMP/merged.pdf" from-go-build-to-go-run.pdf
          fi

      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" from-go-build-to-go-run.pdf --clobber
          else
            gh release create "$TAG" from-go-build-to-go-run.pdf \
              --title "From Go Build To Go Run $TAG" \
              --generate-notes
          fi
